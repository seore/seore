<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#7F00FF"/><stop offset="1" stop-color="#E100FF"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
</defs>
<style>
  .b1{animation:m1 14s ease-in-out infinite alternate}
  .b2{animation:m2 18s ease-in-out infinite alternate}
  .b3{animation:m3 16s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate(220px,60px)}}
  @keyframes m2{to{transform:translate(-260px,-40px)}}
  @keyframes m3{to{transform:translate(-120px,70px)}}
  .name{font:800 72px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:url(#name);letter-spacing:-1.5px}
  .hi{font:600 18px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#c084fc;letter-spacing:2px}
  .role{font:500 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:#d1d5db}
  .pill{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:#e9d5ff;letter-spacing:1px}
  .bar{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleX(0);transform-origin:80px 0}
  @keyframes grow{to{transform:scaleX(1)}}
  .in{opacity:0;animation:fade .9s ease forwards}
  .d1{animation-delay:.1s} .d2{animation-delay:.35s} .d3{animation-delay:.6s}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .dot{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .star{animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.15}}
  
  .r0{opacity:0;animation:r0 12.0s infinite}
  @keyframes r0{0%,0.00%{opacity:0;transform:translateY(8px)}
    3.00%,21.00%{opacity:1;transform:translateY(0)}
    24.00%,100%{opacity:0;transform:translateY(-8px)}}
  .r1{opacity:0;animation:r1 12.0s infinite}
  @keyframes r1{0%,24.99%{opacity:0;transform:translateY(8px)}
    28.00%,46.00%{opacity:1;transform:translateY(0)}
    49.00%,100%{opacity:0;transform:translateY(-8px)}}
  .r2{opacity:0;animation:r2 12.0s infinite}
  @keyframes r2{0%,49.99%{opacity:0;transform:translateY(8px)}
    53.00%,71.00%{opacity:1;transform:translateY(0)}
    74.00%,100%{opacity:0;transform:translateY(-8px)}}
  .r3{opacity:0;animation:r3 12.0s infinite}
  @keyframes r3{0%,74.99%{opacity:0;transform:translateY(8px)}
    78.00%,96.00%{opacity:1;transform:translateY(0)}
    99.00%,100%{opacity:0;transform:translateY(-8px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="#0d1117"/>
  <g filter="url(#blur)" opacity="0.85">
    <circle class="b1" cx="300" cy="80" r="170" fill="#7F00FF"/>
    <circle class="b2" cx="1000" cy="260" r="190" fill="#E100FF" opacity=".7"/>
    <circle class="b3" cx="760" cy="40" r="130" fill="#3b82f6" opacity=".45"/>
  </g>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="#0d1117" opacity=".25"/>
  <g fill="#fff">
    <circle class="star" cx="1040" cy="70" r="2" style="animation-delay:.3s"/>
    <circle class="star" cx="1110" cy="140" r="1.5" style="animation-delay:1.1s"/>
    <circle class="star" cx="930" cy="110" r="1.5" style="animation-delay:2s"/>
    <circle class="star" cx="1150" cy="60" r="1.2" style="animation-delay:.8s"/>
  </g>
  <text class="hi in d1" x="80" y="88">HEY THERE, I'M</text>
  <text class="name in d2" x="76" y="168">Seore Soyannwo</text>
  <rect class="bar" x="80" y="190" width="120" height="5" rx="2.5" fill="url(#line)"/>
  <text class="role r0" x="80" y="232">Full-stack developer</text>
<text class="role r1" x="80" y="232">Shipping apps to the App Store</text>
<text class="role r2" x="80" y="232">Game dev — Godot · Unity · Roblox</text>
<text class="role r3" x="80" y="232">Artist &amp; photographer</text>

  <g transform="translate(80 262)"><g class="in d3">
    <rect width="214" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#c084fc" stroke-opacity=".45"/>
    <circle class="dot" cx="20" cy="17" r="5" fill="#4ade80"/>
    <text class="pill" x="34" y="22">LONDON × LAGOS</text>
  </g></g>
  <g transform="translate(306 262)"><g class="in d3">
    <rect width="246" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#c084fc" stroke-opacity=".45"/>
    <text class="pill" x="18" y="22">OPEN TO OPPORTUNITIES</text>
  </g></g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</g>
</svg>