<svg xmlns="http://www.w3.org/2000/svg" width="580" height="190" viewBox="0 0 580 190">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7F00FF"/><stop offset="1" stop-color="#E100FF"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="580" height="190" rx="16"/></clipPath>
</defs>
<style>
  .t{font:700 22px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:#f0f6fc}
  .desc{font:400 15.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:#9da7b3}
  .tag{font:600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:#e9d5ff}
  .st{font:700 11px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif;fill:#facc15;letter-spacing:1px}
  .dot{animation:p 1.8s ease-in-out infinite} @keyframes p{50%{opacity:.2}}
  .sh{animation:s 6s ease-in-out infinite} @keyframes s{0%{transform:translateX(-300px)}60%,100%{transform:translateX(680px)}}
  .ic{animation:f 4s ease-in-out infinite} @keyframes f{50%{transform:translateY(-4px)}}
</style>
<g clip-path="url(#c)">
  <rect width="580" height="190" fill="#161b22"/>
  <circle cx="540" cy="-20" r="120" fill="url(#g)" opacity=".10"/>
  <rect class="sh" x="0" y="0" width="200" height="190" fill="url(#sheen)" transform="skewX(-20)"/>
  <g transform="translate(58 64)"><g class="ic">
    <rect x="-30" y="-30" width="60" height="60" rx="16" fill="url(#g)"/>
    <rect x="-17" y="-9" width="34" height="20" rx="10" fill="none" stroke="#fff" stroke-width="3"/><path d="M-9 1h8M-5 -3v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="7" cy="-1" r="2.2" fill="#fff"/><circle cx="11" cy="4" r="2.2" fill="#fff"/>
  </g></g>
  <text class="t" x="110" y="68">Lagos Market Hustle</text>
  <g transform="translate(417.6 24)">
    <rect width="140" height="24" rx="12" fill="#facc15" fill-opacity=".1" stroke="#facc15" stroke-opacity=".4"/>
    <circle class="dot" cx="13" cy="12" r="4" fill="#facc15"/>
    <text class="st" x="24" y="16">PLAYABLE SLICE</text>
  </g>
  <text class="desc" x="110" y="98">3D third-person trading game set on the</text><text class="desc" x="110" y="120">streets of Lagos.</text>
  <rect x="110" y="146" width="65" height="26" rx="13" fill="#c084fc" fill-opacity=".12" stroke="#c084fc" stroke-opacity=".35"/><text class="tag" x="142" y="163.5" text-anchor="middle">Godot</text><rect x="183.0" y="146" width="40" height="26" rx="13" fill="#c084fc" fill-opacity=".12" stroke="#c084fc" stroke-opacity=".35"/><text class="tag" x="203" y="163.5" text-anchor="middle">3D</text>
  <rect x=".5" y=".5" width="579" height="189" rx="16" fill="none" stroke="#30363d"/>
</g>
</svg>